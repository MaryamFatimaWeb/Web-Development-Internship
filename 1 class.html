```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layout Design</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background-color: white;
      padding: 10px;
    }

    .header,
    .nav,
    .footer{
      background-color: #dfe3e6;
      text-align: center;
      padding: 30px;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .container{
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .left,
    .right{
      width: 20%;
      background-color: #dfe3e6;
      height: 350px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }

    .main{
      width: 60%;
      background-color: #dfe3e6;
      height: 350px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <div class="header">
    Header
  </div>

  <div class="nav">
    Navigation Menu
  </div>

  <div class="container">

    <div class="left">
      Content
    </div>

    <div class="main">
      Main Content
    </div>

    <div class="right">
      Content
    </div>

  </div>

  <div class="footer">
    Footer
  </div>

</body>
</html>
